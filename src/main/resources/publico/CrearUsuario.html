<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    <title>Crear Usuario - Blog</title>
</head>

<body>
    <header class="header container-fluid py-4 mb-4 border-bottom shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="m-0"><a href="/Inicio.html" class="text-white text-decoration-none">Programacion Web</a></h1>
            <nav id="auth-links" class="nav-links d-none d-md-block">
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card bg-dark text-white border-secondary shadow-lg">
                    <div class="card-header bg-secondary">
                        <h2 class="mb-0">Crear Nuevo Usuario</h2>
                        <small class="text-white-50">Solo administradores pueden crear usuarios</small>
                    </div>
                    <div class="card-body">
                        <div id="error-container" style="display: none;"></div>
                        <div id="success-container" style="display: none;"></div>

                        <form id="formCrearUsuario" onsubmit="return crearUsuario(event)">
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <input type="text" class="form-control bg-secondary text-white border-0" 
                                       id="usuario" name="usuario" placeholder="Nombre de usuario" required 
                                       minlength="3">
                                <small class="text-white-50">Mínimo 3 caracteres</small>
                            </div>

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control bg-secondary text-white border-0" 
                                       id="nombre" name="nombre" placeholder="Nombre completo" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control bg-secondary text-white border-0" 
                                       id="password" name="password" placeholder="Contraseña" required 
                                       minlength="6" oninput="validarPassword()">
                                <div id="passwordStrength" class="mt-1" style="font-size: 0.85em;"></div>
                            </div>

                            <div class="mb-3">
                                <label for="fotoUsuario" class="form-label">Foto (opcional)</label>
                                <input type="file" class="form-control bg-secondary text-white border-0" id="fotoUsuario" 
                                       accept="image/*" onchange="previewFoto(this)">
                                <div id="fotoPreview" class="mt-2" style="display:none;">
                                    <img id="fotoPreviewImg" src="" alt="Vista previa" class="img-thumbnail" style="max-width: 120px; max-height: 120px;">
                                    <small class="text-white-50 d-block">Se almacenará en base64</small>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Permisos</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="checkAdministrador" name="administrador">
                                    <label class="form-check-label" for="checkAdministrador">
                                        Administrador (acceso completo)
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="checkAutor" name="autor" checked>
                                    <label class="form-check-label" for="checkAutor">
                                        Autor (puede crear artículos)
                                    </label>
                                </div>
                                <small class="text-white-50 d-block mt-2">
                                    Si no se marca ningún permiso, el usuario solo podrá leer artículos.
                                </small>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Crear Usuario</button>
                                <a href="/Inicio.html" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container-fluid py-4 mt-5 border-top text-center opacity-75">
        <p>2026 Programación Web - ICC-352</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadUser();
            verificarPermisos();
        });

        async function loadUser() {
            try {
                const res = await fetch('/api/usuario');
                if (res.status === 200) {
                    currentUser = await res.json();
                    renderUserUI();
                } else {
                    window.location.href = '/Login.html';
                }
            } catch (e) {
                console.error(e);
                window.location.href = '/Login.html';
            }
        }

        function renderUserUI() {
            document.getElementById('auth-links').innerHTML = `
                <span class="text-dark me-3 fw-bold">Hola, ${currentUser.nombre || currentUser.usuario}</span>
                <a href="/logout" class="btn btn-outline-danger fw-bold btn-sm">Salir</a>`;
        }

        let fotoBase64Data = null;

        function previewFoto(input) {
            const preview = document.getElementById('fotoPreview');
            const img = document.getElementById('fotoPreviewImg');
            fotoBase64Data = null;
            if (input.files && input.files[0]) {
                const file = input.files[0];
                if (!file.type.startsWith('image/')) {
                    mostrarMensaje('error', 'Por favor selecciona un archivo de imagen (JPG, PNG, etc.).');
                    input.value = '';
                    preview.style.display = 'none';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    fotoBase64Data = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        }

        function verificarPermisos() {
            if (!currentUser || !currentUser.administrador) {
                mostrarMensaje('error', 'Solo los administradores pueden crear usuarios.');
                setTimeout(() => {
                    window.location.href = '/Inicio.html';
                }, 2000);
            }
        }

        function validarPassword() {
            const password = document.getElementById('password').value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.textContent = '';
                strengthDiv.className = '';
                return;
            }
            
            if (password.length < 6) {
                strengthDiv.textContent = 'Contraseña débil (mínimo 6 caracteres)';
                strengthDiv.className = 'text-danger';
            } else if (password.length < 10) {
                strengthDiv.textContent = 'Contraseña media';
                strengthDiv.className = 'text-warning';
            } else {
                strengthDiv.textContent = 'Contraseña fuerte';
                strengthDiv.className = 'text-success';
            }
        }

        async function crearUsuario(event) {
            event.preventDefault();

            if (!currentUser || !currentUser.administrador) {
                mostrarMensaje('error', 'No tienes permisos para crear usuarios.');
                return false;
            }

            const usuario = document.getElementById('usuario').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const password = document.getElementById('password').value;
            const administrador = document.getElementById('checkAdministrador').checked;
            const autor = document.getElementById('checkAutor').checked;

            if (usuario.length < 3) {
                mostrarMensaje('error', 'El usuario debe tener al menos 3 caracteres.');
                return false;
            }

            if (password.length < 6) {
                mostrarMensaje('error', 'La contraseña debe tener al menos 6 caracteres.');
                return false;
            }

            const payload = {
                usuario: usuario,
                nombre: nombre,
                password: password,
                administrador: administrador,
                autor: autor,
                fotoBase64: fotoBase64Data || undefined
            };

            try {
                const res = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    mostrarMensaje('success', `Usuario "${usuario}" creado exitosamente.`);
                    document.getElementById('formCrearUsuario').reset();
                    document.getElementById('checkAutor').checked = true; // Reset al estado por defecto
                    setTimeout(() => {
                        window.location.href = '/Inicio.html';
                    }, 2000);
                } else {
                    const status = res.status;
                    let mensaje = await res.text();
                    
                    if (status === 403) {
                        mensaje = 'Solo los administradores pueden crear usuarios.';
                    } else if (status === 400 && mensaje.includes('ya existe')) {
                        mensaje = 'El usuario ya existe. Por favor elige otro nombre de usuario.';
                    } else if (status === 400) {
                        mensaje = mensaje || 'Faltan datos requeridos.';
                    }
                    
                    mostrarMensaje('error', mensaje);
                }
            } catch (e) {
                console.error('Error al crear usuario:', e);
                mostrarMensaje('error', 'Error de conexión. Por favor intenta de nuevo.');
            }

            return false;
        }

        function mostrarMensaje(tipo, mensaje) {
            const errorContainer = document.getElementById('error-container');
            const successContainer = document.getElementById('success-container');
            
            errorContainer.style.display = 'none';
            successContainer.style.display = 'none';
            
            const alertClass = tipo === 'success' ? 'alert-success' : 'alert-danger';
            const icon = tipo === 'success' ? '✓' : '✗';
            const container = tipo === 'success' ? successContainer : errorContainer;
            
            container.innerHTML = `
                <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                    <strong>${icon}</strong> ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            container.style.display = 'block';
            
            setTimeout(() => {
                const alert = container.querySelector('.alert');
                if (alert) {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                }
            }, 5000);
        }
    </script>
</body>

</html>
