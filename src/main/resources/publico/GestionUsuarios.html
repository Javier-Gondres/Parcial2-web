<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    <title>Gestión de Usuarios</title>
</head>

<body>
    <header class="header container-fluid py-4 mb-4 border-bottom shadow-sm bg-light">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="m-0 text-primary">Gestión de Eventos</h1>
            <nav id="auth-links" class="nav-links d-none d-md-flex align-items-center flex-wrap gap-2">
            </nav>
            <div class="d-md-none">
                <a href="Login.html" class="text-dark fw-bold me-2 small text-decoration-underline">Login</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Gestión de Usuarios</h3>
            <a href="Inicio.html" class="btn btn-secondary fw-bold">Volver al Inicio</a>
        </div>

        <div class="bg-white p-4 shadow-sm rounded border-start border-4 border-info">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Nombre Completo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">
                                <div class="spinner-border text-primary mb-2" role="status"></div>
                                <p class="mb-0">Cargando usuarios...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div id="error-container" style="display: none;" class="mt-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let usuarioActual = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await cargarUsuarioLocal();
            await cargarListaUsuarios();
        });

        async function cargarUsuarioLocal() {
            try {
                const res = await fetch('/api/usuario');
                if (res.ok) {
                    usuarioActual = await res.json();
                    dibujarMenuUsuario();

                    if (usuarioActual.rol !== 'ADMINISTRADOR') {
                        document.querySelector('main').innerHTML = '<div class="alert alert-danger mt-5">Acceso denegado. Se requiere rol de Administrador.</div>';
                    }
                } else {
                    document.querySelector('main').innerHTML = '<div class="alert alert-danger mt-5">Debe iniciar sesión para acceder a la gestión de usuarios.</div>';
                }
            } catch (error) {
                console.error("Error obteniendo usuario actual:", error);
            }
        }

        function dibujarMenuUsuario() {
            const contenedorAutenticacion = document.getElementById('auth-links');
            if (usuarioActual) {
                contenedorAutenticacion.innerHTML = `
                    <span class="text-dark fw-bold me-3">${usuarioActual.nombre} (${usuarioActual.rol})</span>
                    <a href="/logout" class="btn btn-sm btn-outline-danger">Salir</a>
                `;
            }
        }

        async function cargarListaUsuarios() {
            const tabla = document.getElementById('tablaUsuarios');
            try {
                const res = await fetch('/api/usuarios');
                if (!res.ok) throw new Error("Fallo la consulta al backend");

                const listaUsuarios = await res.json();
                let htmlDestino = '';

                if (listaUsuarios.length === 0) {
                    tabla.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No hay usuarios registrados.</td></tr>';
                    return;
                }

                listaUsuarios.forEach(usuario => {
                    const esAdministrador = usuario.rol === 'ADMINISTRADOR';
                    let botonesAcciones = '';

                    if (!esAdministrador) {
                        if (usuario.rol === 'PARTICIPANTE') {
                            botonesAcciones += `<button class="btn btn-sm btn-success me-1 fw-bold" onclick="cambiarRol(${usuario.id}, 'ORGANIZADOR')">Hacer Organizador</button>`;
                        } else if (usuario.rol === 'ORGANIZADOR') {
                            botonesAcciones += `<button class="btn btn-sm btn-warning text-dark me-1 fw-bold" onclick="cambiarRol(${usuario.id}, 'PARTICIPANTE')">Revocar Organizador</button>`;
                        }

                        if (usuario.bloqueado) {
                            botonesAcciones += `<button class="btn btn-sm btn-info fw-bold text-dark" onclick="cambiarBloqueo(${usuario.id}, false)">Desbloquear</button>`;
                        } else {
                            botonesAcciones += `<button class="btn btn-sm btn-danger fw-bold" onclick="cambiarBloqueo(${usuario.id}, true)">Bloquear</button>`;
                        }
                    } else {
                        botonesAcciones = '<span class="text-muted small">Sin acciones permitidas</span>';
                    }

                    htmlDestino += `
                        <tr>
                            <td>${usuario.id}</td>
                            <td class="fw-bold">${usuario.usuario}</td>
                            <td>${usuario.nombre}</td>
                            <td><span class="badge ${esAdministrador ? 'bg-primary' : (usuario.rol === 'ORGANIZADOR' ? 'bg-success' : 'bg-secondary')}">${usuario.rol}</span></td>
                            <td>
                                ${usuario.bloqueado ? '<span class="text-danger fw-bold">Bloqueado</span>' : '<span class="text-success fw-bold">Activo</span>'}
                            </td>
                            <td>${botonesAcciones}</td>
                        </tr>
                    `;
                });

                tabla.innerHTML = htmlDestino;
            } catch (error) {
                console.error(error);
                tabla.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error de conexión al cargar usuarios.</td></tr>';
            }
        }

        async function cambiarRol(identificador, nuevoRol) {
            try {
                const res = await fetch(`/api/usuarios/${identificador}/rol`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rol: nuevoRol })
                });

                if (res.ok) {
                    cargarListaUsuarios();
                } else {
                    const msg = await res.text();
                    alert("No se pudo cambiar el rol: " + msg);
                }
            } catch (error) {
                console.error("Error conectando:", error);
            }
        }

        async function cambiarBloqueo(identificador, bloquear) {
            const confirmacion = bloquear ? "bloquear" : "desbloquear";
            if (confirm("Seguro que deseas " + confirmacion + " a este usuario?")) {
                try {
                    const res = await fetch(`/api/usuarios/${identificador}/bloqueo`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ bloqueado: bloquear })
                    });

                    if (res.ok) {
                        cargarListaUsuarios();
                    } else {
                        const msg = await res.text();
                        alert("No se pudo efectuar la operación: " + msg);
                    }
                } catch (error) {
                    console.error("Error conectando:", error);
                }
            }
        }
    </script>
</body>

</html>
