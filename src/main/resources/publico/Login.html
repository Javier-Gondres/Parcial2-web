<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Login - Eventos Academicos</title>
    <style>
        .recordar-row {
            text-align: center;
            margin-bottom: 20px;
        }

        .recordar-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            cursor: pointer;
            font-weight: bold;
        }

        .recordar-label input[type="checkbox"] {
            flex-shrink: 0;
            margin: 0;
            accent-color: var(--accent-blue, #78fffa);
            width: 18px;
            height: 18px;
        }

        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 3px solid #ff6b6b;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 3px solid #51cf66;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="form-container-simple">
        <h1>Iniciar sesión</h1>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form action="/procesarLogin" method="post">
            <div class="form-group-simple">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required>
            </div>
            <div class="form-group-simple">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>
            <div class="form-group-simple recordar-row">
                <label for="recordar" class="recordar-label">
                    <input type="checkbox" id="recordar" name="recordar" value="on">
                    <span>Recordar usuario</span>
                </label>
            </div>
            <button type="submit" class="btn-simple">Entrar</button>
        </form>

        <div style="margin-top: 20px;">
            <p><a href="Registro.html" style="color: var(--accent-blue);">Regístrate</a></p>
            <a href="Inicio.html" style="color: rgb(0, 0, 0); opacity: 0.7; font-size: 0.9rem;">Volver al inicio</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = 'Usuario o contrasena incorrectos. Por favor intenta de nuevo.';
            errorDiv.classList.add('show');
        }
        if (urlParams.get('registered')) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = 'Registro completado. Ya puedes iniciar sesion.';
            successDiv.classList.add('show');
        }
    </script>
</body>

</html>
