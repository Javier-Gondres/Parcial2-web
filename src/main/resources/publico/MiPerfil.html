<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    <title>Mi Perfil</title>
    <style>
        .profile-card {
            max-width: 680px;
            margin: 40px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #dbeafe;
        }

        @media (max-width: 767.98px) {
            .profile-card {
                margin: 24px auto;
            }
        }

        @media (max-width: 575.98px) {
            .profile-card {
                margin: 16px auto;
                border-radius: 14px;
            }

            .profile-avatar {
                width: 92px;
                height: 92px;
            }

            .profile-actions {
                flex-direction: column;
            }

            .profile-actions > * {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header class="header container-fluid py-4 mb-4 border-bottom shadow-sm bg-light">
        <div class="container app-header-inner">
            <h1 class="m-0 text-primary">Gestión de Eventos</h1>
            <nav id="auth-links" class="nav-links app-auth-nav"></nav>
        </div>
    </header>

    <main class="container">
        <div class="profile-card p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div>
                    <h2 class="fw-bold mb-1">Mi perfil</h2>
                    <p class="text-muted mb-0">Actualiza tu informacion basica y foto de perfil.</p>
                </div>
                <a href="Inicio.html" class="btn btn-outline-secondary">Volver al inicio</a>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none"></div>
            <div id="successMessage" class="alert alert-success d-none"></div>

            <form id="perfilForm">
                <div class="text-center mb-4">
                    <img id="fotoPreviewImg" class="profile-avatar" alt="Foto de perfil">
                    <div class="mt-3">
                        <input type="file" id="fotoPerfil" class="form-control" accept="image/*">
                        <input type="hidden" id="fotoBase64" value="">
                        <button type="button" class="btn btn-sm btn-outline-danger mt-2" onclick="eliminarFoto()">Quitar foto</button>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="usuario" class="form-label fw-bold">Usuario</label>
                        <input type="text" id="usuario" class="form-control" required minlength="3">
                    </div>
                    <div class="col-md-6">
                        <label for="nombre" class="form-label fw-bold">Nombre completo</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-bold">Nueva contrasena</label>
                        <input type="password" id="password" class="form-control" minlength="6" placeholder="Opcional">
                        <small class="text-muted">Dejala vacia si no deseas cambiarla.</small>
                    </div>
                    <div class="col-md-6">
                        <label for="confirmPassword" class="form-label fw-bold">Confirmar contrasena</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Opcional">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 profile-actions">
                    <a href="Inicio.html" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary fw-bold">Guardar cambios</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        let usuarioActual = null;
        let fotoBase64Actual = null;

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('fotoPerfil').addEventListener('change', manejarCambioFoto);
            document.getElementById('perfilForm').addEventListener('submit', guardarPerfil);
            await cargarPerfil();
        });

        async function cargarPerfil() {
            try {
                const res = await fetch('/api/usuario');
                if (!res.ok) {
                    window.location.href = 'Login.html';
                    return;
                }

                usuarioActual = await res.json();
                dibujarMenuUsuario();
                llenarFormulario(usuarioActual);
            } catch (error) {
                mostrarError('No se pudo cargar la informacion del perfil.');
                console.error(error);
            }
        }

        function dibujarMenuUsuario() {
            const contenedor = document.getElementById('auth-links');
            contenedor.innerHTML = `
                <span class="text-dark fw-bold">${usuarioActual.nombre} (${usuarioActual.rol})</span>
                <a href="MiPerfil.html" class="btn btn-sm btn-outline-primary">Mi perfil</a>
                <a href="/logout" class="btn btn-sm btn-outline-danger">Salir</a>
            `;
        }

        function llenarFormulario(usuario) {
            document.getElementById('usuario').value = usuario.usuario || '';
            document.getElementById('nombre').value = usuario.nombre || '';
            document.getElementById('password').value = '';
            document.getElementById('confirmPassword').value = '';
            fotoBase64Actual = usuario.fotoBase64 || '';
            document.getElementById('fotoBase64').value = fotoBase64Actual;
            actualizarPreviewFoto(fotoBase64Actual, usuario.nombre);
        }

        function manejarCambioFoto(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) {
                return;
            }
            if (!file.type.startsWith('image/')) {
                mostrarError('Selecciona una imagen valida.');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                fotoBase64Actual = e.target.result;
                document.getElementById('fotoBase64').value = fotoBase64Actual;
                actualizarPreviewFoto(fotoBase64Actual, document.getElementById('nombre').value);
            };
            reader.readAsDataURL(file);
        }

        function eliminarFoto() {
            fotoBase64Actual = '';
            document.getElementById('fotoBase64').value = '';
            document.getElementById('fotoPerfil').value = '';
            actualizarPreviewFoto('', document.getElementById('nombre').value);
        }

        function actualizarPreviewFoto(fotoBase64, nombre) {
            const img = document.getElementById('fotoPreviewImg');
            if (fotoBase64) {
                img.src = fotoBase64;
                return;
            }

            const iniciales = getInitials(nombre);
            img.src = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="110" height="110">
                    <rect width="100%" height="100%" fill="#dbeafe"/>
                    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
                        font-family="Arial" font-size="36" font-weight="bold" fill="#2563eb">${iniciales}</text>
                </svg>
            `)}`;
        }

        async function guardarPerfil(event) {
            event.preventDefault();
            ocultarMensajes();

            const usuario = document.getElementById('usuario').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (usuario.length < 3) {
                mostrarError('El usuario debe tener al menos 3 caracteres.');
                return;
            }

            if (password && password.length < 6) {
                mostrarError('La contrasena debe tener al menos 6 caracteres.');
                return;
            }

            if (password !== confirmPassword) {
                mostrarError('Las contrasenas no coinciden.');
                return;
            }

            try {
                const res = await fetch('/api/mi-perfil', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario,
                        nombre,
                        password,
                        fotoBase64: document.getElementById('fotoBase64').value
                    })
                });

                if (!res.ok) {
                    throw new Error(await res.text());
                }

                usuarioActual = await res.json();
                llenarFormulario(usuarioActual);
                dibujarMenuUsuario();
                mostrarExito('Perfil actualizado correctamente.');
            } catch (error) {
                console.error(error);
                mostrarError(error.message || 'No se pudo actualizar el perfil.');
            }
        }

        function getInitials(nombre) {
            if (!nombre) return 'U';
            const partes = nombre.trim().split(/\s+/).filter(Boolean).slice(0, 2);
            return partes.map(parte => parte[0].toUpperCase()).join('');
        }

        function mostrarError(message) {
            const div = document.getElementById('errorMessage');
            div.textContent = message;
            div.classList.remove('d-none');
        }

        function mostrarExito(message) {
            const div = document.getElementById('successMessage');
            div.textContent = message;
            div.classList.remove('d-none');
        }

        function ocultarMensajes() {
            document.getElementById('errorMessage').classList.add('d-none');
            document.getElementById('successMessage').classList.add('d-none');
        }
    </script>
</body>

</html>
