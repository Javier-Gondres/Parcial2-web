<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Registro - Blog</title>
    <style>
        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 3px solid #ff6b6b;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 3px solid #51cf66;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .password-strength {
            font-size: 0.85em;
            margin-top: 5px;
        }
        .password-strength.weak { color: #ff6b6b; }
        .password-strength.medium { color: #ffd93d; }
        .password-strength.strong { color: #51cf66; }
    </style>
</head>

<body>
    <div class="form-container-simple">
        <h1>Crea tu cuenta</h1>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="registroForm" action="/Registro" method="post" onsubmit="return validarFormulario(event)">
            <div class="form-group-simple">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
                <small style="color: rgba(255,255,255,0.7); font-size: 0.85em;">Mínimo 3 caracteres</small>
            </div>
            <div class="form-group-simple">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="form-group-simple">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required 
                       minlength="6" oninput="validarPassword()">
                <div id="passwordStrength" class="password-strength"></div>
            </div>
            <div class="form-group-simple">
                <label for="confirmPassword">Confirmar Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña"
                    required oninput="validarConfirmacion()">
                <div id="confirmMessage" style="font-size: 0.85em; margin-top: 5px;"></div>
            </div>
            <div class="form-group-simple">
                <label for="fotoPerfil">Foto de perfil (opcional)</label>
                <input type="file" id="fotoPerfil" name="fotoPerfil" accept="image/*" onchange="previewFotoPerfil(this)">
                <input type="hidden" name="fotoBase64" id="fotoBase64" value="">
                <div id="fotoPerfilPreview" class="mt-2" style="display:none;">
                    <img id="fotoPerfilPreviewImg" src="" alt="Vista previa" style="max-width: 80px; max-height: 80px; border-radius: 50%; object-fit: cover;">
                </div>
            </div>
            <button type="submit" class="btn-simple">Registrarse</button>
        </form>

        <div style="margin-top: 20px;">
            <p><a href="Login.html" style="color: var(--accent-blue);">Inicia sesión</a></p>
            <a href="Inicio.html" style="color: white; opacity: 0.7; font-size: 0.9rem;">Volver al inicio</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorDiv = document.getElementById('errorMessage');
            if (error === 'usuario_existe') {
                errorDiv.textContent = 'El usuario ya existe. Por favor elige otro nombre de usuario.';
            } else {
                errorDiv.textContent = 'Error al registrarse. Por favor verifica los datos e intenta de nuevo.';
            }
            errorDiv.classList.add('show');
        }

        function validarPassword() {
            const password = document.getElementById('password').value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.textContent = '';
                strengthDiv.className = 'password-strength';
                return;
            }
            
            if (password.length < 6) {
                strengthDiv.textContent = 'Contraseña débil (mínimo 6 caracteres)';
                strengthDiv.className = 'password-strength weak';
            } else if (password.length < 10) {
                strengthDiv.textContent = 'Contraseña media';
                strengthDiv.className = 'password-strength medium';
            } else {
                strengthDiv.textContent = 'Contraseña fuerte';
                strengthDiv.className = 'password-strength strong';
            }
        }

        function validarConfirmacion() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const confirmDiv = document.getElementById('confirmMessage');
            
            if (confirmPassword.length === 0) {
                confirmDiv.textContent = '';
                return;
            }
            
            if (password === confirmPassword) {
                confirmDiv.textContent = '✓ Las contraseñas coinciden';
                confirmDiv.style.color = '#51cf66';
            } else {
                confirmDiv.textContent = '✗ Las contraseñas no coinciden';
                confirmDiv.style.color = '#ff6b6b';
            }
        }

        let fotoBase64Registro = null;

        function previewFotoPerfil(input) {
            const preview = document.getElementById('fotoPerfilPreview');
            const img = document.getElementById('fotoPerfilPreviewImg');
            const hidden = document.getElementById('fotoBase64');
            fotoBase64Registro = null;
            hidden.value = '';
            if (!input.files || !input.files[0]) {
                preview.style.display = 'none';
                return;
            }
            const file = input.files[0];
            if (!file.type.startsWith('image/')) {
                document.getElementById('errorMessage').textContent = 'Selecciona una imagen (JPG, PNG, etc.).';
                document.getElementById('errorMessage').classList.add('show');
                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                fotoBase64Registro = e.target.result;
                hidden.value = fotoBase64Registro;
                img.src = fotoBase64Registro;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function validarFormulario(event) {
            const usuario = document.getElementById('usuario').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
            
            if (usuario.length < 3) {
                errorDiv.textContent = 'El usuario debe tener al menos 3 caracteres.';
                errorDiv.classList.add('show');
                event.preventDefault();
                return false;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                errorDiv.classList.add('show');
                event.preventDefault();
                return false;
            }
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Las contraseñas no coinciden.';
                errorDiv.classList.add('show');
                event.preventDefault();
                return false;
            }
            
            return true;
        }
    </script>
</body>

</html>
